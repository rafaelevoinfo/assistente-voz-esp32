<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" font-family="Segoe UI, Arial, sans-serif">
<rect width="1400" height="1040" fill="#ffffff"/>
<text x="40" y="46" font-size="28" font-weight="700" fill="#111827">Amplificador MAX98357A + alto-falante</text>
<text x="40" y="74" font-size="15" fill="#4b5563">Passo 1: soldar o módulo · Passo 2: ligar na protoboard e no ESP32-S3 · Passo 3: conferir antes de ligar o USB</text>
<circle cx="56" cy="118" r="16" fill="#2563eb"/>
<text x="56" y="124" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="82" y="125" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Soldar o módulo</text>
<rect x="70" y="170" width="330" height="250" rx="12" fill="#7c3aed"/>
<text x="235.0" y="289.0" font-size="18" fill="#f5f3ff" font-weight="700" text-anchor="middle">MAX98357A</text>
<text x="235.0" y="311.0" font-size="12" fill="#ddd6fe" font-weight="400" text-anchor="middle">vista de cima (lado do chip)</text>
<rect x="213.0" y="325.0" width="44" height="34" rx="4" fill="#111827"/>
<text x="235.0" y="347.0" font-size="11" fill="#9ca3af" font-weight="400" text-anchor="middle">chip</text>
<rect x="185.0" y="136" width="100" height="52" rx="6" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
<circle cx="212.0" cy="162" r="12" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
<line x1="204.0" y1="162" x2="220.0" y2="162" stroke="#374151" stroke-width="3"/>
<text x="212.0" y="204" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">+</text>
<circle cx="258.0" cy="162" r="12" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
<line x1="250.0" y1="162" x2="266.0" y2="162" stroke="#374151" stroke-width="3"/>
<text x="258.0" y="204" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">−</text>
<text x="297.0" y="150" font-size="13" fill="#14532d" font-weight="600" text-anchor="start">borne de parafuso</text>
<text x="297.0" y="167" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">(2 furos com + e −)</text>
<circle cx="111.25" cy="394" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="111.25" y="376" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">LRC</text>
<circle cx="152.5" cy="394" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="152.5" y="376" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">BCLK</text>
<circle cx="193.75" cy="394" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="193.75" y="376" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">DIN</text>
<circle cx="235.0" cy="394" r="9" fill="#c4b5fd" stroke="#111827" stroke-width="2"/>
<text x="235.0" y="376" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">GAIN</text>
<circle cx="276.25" cy="394" r="9" fill="#c4b5fd" stroke="#111827" stroke-width="2"/>
<text x="276.25" y="376" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">SD</text>
<circle cx="317.5" cy="394" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="317.5" y="376" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">GND</text>
<circle cx="358.75" cy="394" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="358.75" y="376" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">VIN</text>
<text x="235.0" y="442" font-size="12" fill="#4b5563" font-weight="400" text-anchor="middle">barra de 7 pinos: solde os 7 (GAIN e SD ficam sem fio)</text>
<text x="460" y="180" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Vista de lado: a barra de pinos</text>
<rect x="460" y="350" width="330" height="48" rx="6" fill="#f5f5f4" stroke="#a8a29e" stroke-width="2"/>
<text x="625" y="380" font-size="13" fill="#78716c" font-weight="400" text-anchor="middle">protoboard</text>
<rect x="500" y="252" width="250" height="14" rx="3" fill="#7c3aed"/>
<text x="625" y="214" font-size="12" fill="#7c3aed" font-weight="600" text-anchor="middle">módulo (chip para cima)</text>
<rect x="527" y="230" width="6" height="22" fill="#a16207"/>
<rect x="527" y="266" width="6" height="96" fill="#a16207"/>
<rect x="522" y="278" width="16" height="16" fill="#111827"/>
<path d="M521,252 L539,252 L534,238 L526,238 Z" fill="#9ca3af"/>
<rect x="559" y="230" width="6" height="22" fill="#a16207"/>
<rect x="559" y="266" width="6" height="96" fill="#a16207"/>
<rect x="554" y="278" width="16" height="16" fill="#111827"/>
<path d="M553,252 L571,252 L566,238 L558,238 Z" fill="#9ca3af"/>
<rect x="591" y="230" width="6" height="22" fill="#a16207"/>
<rect x="591" y="266" width="6" height="96" fill="#a16207"/>
<rect x="586" y="278" width="16" height="16" fill="#111827"/>
<path d="M585,252 L603,252 L598,238 L590,238 Z" fill="#9ca3af"/>
<rect x="623" y="230" width="6" height="22" fill="#a16207"/>
<rect x="623" y="266" width="6" height="96" fill="#a16207"/>
<rect x="618" y="278" width="16" height="16" fill="#111827"/>
<path d="M617,252 L635,252 L630,238 L622,238 Z" fill="#9ca3af"/>
<rect x="655" y="230" width="6" height="22" fill="#a16207"/>
<rect x="655" y="266" width="6" height="96" fill="#a16207"/>
<rect x="650" y="278" width="16" height="16" fill="#111827"/>
<path d="M649,252 L667,252 L662,238 L654,238 Z" fill="#9ca3af"/>
<rect x="687" y="230" width="6" height="22" fill="#a16207"/>
<rect x="687" y="266" width="6" height="96" fill="#a16207"/>
<rect x="682" y="278" width="16" height="16" fill="#111827"/>
<path d="M681,252 L699,252 L694,238 L686,238 Z" fill="#9ca3af"/>
<rect x="719" y="230" width="6" height="22" fill="#a16207"/>
<rect x="719" y="266" width="6" height="96" fill="#a16207"/>
<rect x="714" y="278" width="16" height="16" fill="#111827"/>
<path d="M713,252 L731,252 L726,238 L718,238 Z" fill="#9ca3af"/>
<text x="760" y="246" font-size="12" fill="#b45309" font-weight="600" text-anchor="start">← solde aqui</text>
<text x="760" y="291" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">← plástico preto</text>
<text x="760" y="332" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">← ponta longa</text>
<text x="774" y="347" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">na protoboard</text>
<text x="920" y="170" font-size="15" fill="#1d4ed8" font-weight="700" text-anchor="start">a) Barra de pinos</text>
<text x="938" y="191" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Encaixe a barra na protoboard (ponta longa para baixo)</text>
<text x="938" y="210" font-size="13" fill="#111827" font-weight="400" text-anchor="start">e apoie o módulo por cima, chip para cima. A protoboard</text>
<text x="938" y="229" font-size="13" fill="#111827" font-weight="400" text-anchor="start">segura tudo reto enquanto você solda.</text>
<text x="938" y="248" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Solde 1 pino de uma ponta, confira se está reto,</text>
<text x="938" y="267" font-size="13" fill="#111827" font-weight="400" text-anchor="start">depois a outra ponta, e então os do meio.</text>
<text x="920" y="298" font-size="15" fill="#1d4ed8" font-weight="700" text-anchor="start">b) Borne do alto-falante</text>
<text x="938" y="319" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Encaixe o borne verde por cima, com os furos dos fios</text>
<text x="938" y="338" font-size="13" fill="#111827" font-weight="400" text-anchor="start">virados para FORA da placa, e solde os 2 pinos por baixo.</text>
<text x="920" y="369" font-size="15" fill="#1d4ed8" font-weight="700" text-anchor="start">c) Fios do alto-falante</text>
<text x="938" y="390" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Se o alto-falante não tiver fios: solde um fio vermelho no</text>
<text x="938" y="409" font-size="13" fill="#111827" font-weight="400" text-anchor="start">terminal marcado + (ou ponto vermelho) e um preto no outro.</text>
<text x="938" y="428" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Desencape ~5 mm, prenda no borne: vermelho no +, preto no −,</text>
<text x="938" y="447" font-size="13" fill="#111827" font-weight="400" text-anchor="start">e aperte o parafuso. A polaridade só inverte a fase do som.</text>
<text x="920" y="478" font-size="15" fill="#1d4ed8" font-weight="700" text-anchor="start">d) Ponto de solda bom</text>
<text x="938" y="499" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Ferro em ~330 °C, encoste no pino E na ilha ao mesmo tempo,</text>
<text x="938" y="518" font-size="13" fill="#111827" font-weight="400" text-anchor="start">2 s, aí encoste o estanho. Fica um cone brilhante.</text>
<text x="938" y="537" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Cuidado para não emendar dois pinos vizinhos com estanho.</text>
<circle cx="56" cy="553" r="16" fill="#2563eb"/>
<text x="56" y="559" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="82" y="560" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Ligar no ESP32-S3 (fios na protoboard)</text>
<rect x="70" y="600" width="380" height="300" rx="12" fill="#1f2937"/>
<text x="260" y="630" font-size="18" fill="#e5e7eb" font-weight="700" text-anchor="middle">YD-ESP32-S3</text>
<text x="260" y="650" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle">(pinos usados; nomes como na serigrafia)</text>
<text x="410" y="695" font-size="14" fill="#f9fafb" font-weight="600" text-anchor="end">GPIO6</text>
<circle cx="435" cy="690" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="410" y="739" font-size="14" fill="#f9fafb" font-weight="600" text-anchor="end">GPIO7</text>
<circle cx="435" cy="734" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="410" y="783" font-size="14" fill="#f9fafb" font-weight="600" text-anchor="end">GPIO9</text>
<circle cx="435" cy="778" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="410" y="827" font-size="14" fill="#f9fafb" font-weight="600" text-anchor="end">5Vin</text>
<circle cx="435" cy="822" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="410" y="871" font-size="14" fill="#f9fafb" font-weight="600" text-anchor="end">GND</text>
<circle cx="435" cy="866" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<rect x="760" y="600" width="260" height="300" rx="12" fill="#7c3aed"/>
<text x="890" y="630" font-size="18" fill="#f5f3ff" font-weight="700" text-anchor="middle">MAX98357A</text>
<circle cx="760" cy="690" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="780" y="695" font-size="14" fill="#fff" font-weight="700" text-anchor="start">LRC</text>
<circle cx="760" cy="734" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="780" y="739" font-size="14" fill="#fff" font-weight="700" text-anchor="start">BCLK</text>
<circle cx="760" cy="778" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="780" y="783" font-size="14" fill="#fff" font-weight="700" text-anchor="start">DIN</text>
<circle cx="760" cy="822" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="780" y="827" font-size="14" fill="#fff" font-weight="700" text-anchor="start">VIN</text>
<circle cx="760" cy="866" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="780" y="871" font-size="14" fill="#fff" font-weight="700" text-anchor="start">GND</text>
<text x="890" y="882" font-size="12" fill="#ddd6fe" font-weight="400" text-anchor="middle">GAIN e SD: sem fio</text>
<line x1="444" y1="690" x2="751" y2="690" stroke="#0891b2" stroke-width="5" stroke-linecap="round"/>
<line x1="444" y1="734" x2="751" y2="734" stroke="#db2777" stroke-width="5" stroke-linecap="round"/>
<line x1="444" y1="778" x2="751" y2="778" stroke="#65a30d" stroke-width="5" stroke-linecap="round"/>
<line x1="444" y1="822" x2="751" y2="822" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
<line x1="444" y1="866" x2="751" y2="866" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
<line x1="670" y1="822" x2="670" y2="866" stroke="#6b7280" stroke-width="3"/>
<rect x="655" y="828.0" width="30" height="32" rx="5" fill="#1d4ed8" stroke="#fff" stroke-width="2"/>
<text x="670" y="849.0" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">C</text>
<text x="610" y="914" font-size="12" fill="#1d4ed8" font-weight="600" text-anchor="middle">capacitor eletrolítico 470–1000 µF (ou 3–4 × 100 µF em paralelo)</text>
<text x="610" y="932" font-size="12" fill="#1d4ed8" font-weight="400" text-anchor="middle">entre VIN e GND, colado no módulo · perna da faixa "−" no GND</text>
<rect x="835" y="598" width="110" height="16" rx="3" fill="#16a34a"/>
<path d="M865,598 C865,560 990,570 1050,640" fill="none" stroke="#dc2626" stroke-width="4"/>
<path d="M915,598 C915,575 980,590 1050,660" fill="none" stroke="#111827" stroke-width="4"/>
<circle cx="1090" cy="660" r="46" fill="#e5e7eb" stroke="#374151" stroke-width="3"/>
<circle cx="1090" cy="660" r="20" fill="#9ca3af"/>
<text x="1090" y="730" font-size="13" fill="#111827" font-weight="600" text-anchor="middle">alto-falante</text>
<text x="1090" y="747" font-size="12" fill="#4b5563" font-weight="400" text-anchor="middle">4–8 Ω, até 3 W</text>
<text x="1060" y="790" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Resumo</text>
<line x1="1060" y1="809" x2="1084" y2="809" stroke="#0891b2" stroke-width="5"/>
<text x="1092" y="814" font-size="14" fill="#111827" font-weight="600" text-anchor="start">LRC  →  GPIO6</text>
<line x1="1060" y1="831" x2="1084" y2="831" stroke="#db2777" stroke-width="5"/>
<text x="1092" y="836" font-size="14" fill="#111827" font-weight="600" text-anchor="start">BCLK  →  GPIO7</text>
<line x1="1060" y1="853" x2="1084" y2="853" stroke="#65a30d" stroke-width="5"/>
<text x="1092" y="858" font-size="14" fill="#111827" font-weight="600" text-anchor="start">DIN  →  GPIO9</text>
<line x1="1060" y1="875" x2="1084" y2="875" stroke="#dc2626" stroke-width="5"/>
<text x="1092" y="880" font-size="14" fill="#111827" font-weight="600" text-anchor="start">VIN  →  5Vin</text>
<line x1="1060" y1="897" x2="1084" y2="897" stroke="#111827" stroke-width="5"/>
<text x="1092" y="902" font-size="14" fill="#111827" font-weight="600" text-anchor="start">GND  →  GND</text>
<circle cx="56" cy="955" r="16" fill="#2563eb"/>
<text x="56" y="961" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="82" y="962" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Antes de ligar o USB</text>
<text x="78" y="990" font-size="13" fill="#111827" font-weight="400" text-anchor="start">• VIN do amplificador no 5Vin (5 V), não no 3V3.  • O GND do amplificador e o do microfone vão no MESMO GND (use a trilha azul da protoboard).</text>
<text x="78" y="1012" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="start">• Com o jumper IN-OUT fechado, nunca ligue fonte externa no 5Vin com o USB conectado.  • O microfone (INMP441) continua como está.</text>
</svg>