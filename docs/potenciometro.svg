<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" font-family="Segoe UI, Arial, sans-serif">
<rect width="1100" height="700" fill="#ffffff"/>
<text x="40" y="46" font-size="26" fill="#111827" font-weight="700" text-anchor="start">Potenciômetro de volume (10 kΩ)</text>
<text x="40" y="74" font-size="15" fill="#4b5563" font-weight="400" text-anchor="start">Três pernas: as das pontas vão no 3V3 e no GND; a do meio (cursor) vai no GPIO10.</text>
<rect x="60" y="190" width="220" height="170" rx="14" fill="#1f2937"/>
<circle cx="170" cy="275" r="58" fill="#4b5563" stroke="#111827" stroke-width="3"/>
<circle cx="170" cy="275" r="30" fill="#9ca3af" stroke="#111827" stroke-width="3"/>
<line x1="170" y1="275" x2="170" y2="248" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
<text x="170" y="160" font-size="13" fill="#4b5563" font-weight="400" text-anchor="middle">visto de frente (eixo para você)</text>
<rect x="94" y="360" width="12" height="70" fill="#a8a29e"/>
<text x="114" y="385" font-size="15" fill="#d97706" font-weight="700" text-anchor="start">1</text>
<rect x="164" y="360" width="12" height="70" fill="#a8a29e"/>
<text x="184" y="385" font-size="15" fill="#2563eb" font-weight="700" text-anchor="start">2</text>
<rect x="234" y="360" width="12" height="70" fill="#a8a29e"/>
<text x="254" y="385" font-size="15" fill="#111827" font-weight="700" text-anchor="start">3</text>
<text x="86" y="410" font-size="12" fill="#d97706" font-weight="600" text-anchor="end">ponta</text>
<text x="182" y="410" font-size="12" fill="#2563eb" font-weight="600" text-anchor="start">meio</text>
<text x="254" y="410" font-size="12" fill="#111827" font-weight="600" text-anchor="start">ponta</text>
<rect x="700" y="170" width="300" height="300" rx="12" fill="#1f2937"/>
<text x="850" y="202" font-size="18" fill="#e5e7eb" font-weight="700" text-anchor="middle">YD-ESP32-S3</text>
<circle cx="700" cy="270" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="722" y="275" font-size="15" fill="#f9fafb" font-weight="700" text-anchor="start">GND</text>
<circle cx="700" cy="340" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="722" y="345" font-size="15" fill="#f9fafb" font-weight="700" text-anchor="start">GPIO10</text>
<circle cx="700" cy="410" r="9" fill="#fbbf24" stroke="#111827" stroke-width="2"/>
<text x="722" y="415" font-size="15" fill="#f9fafb" font-weight="700" text-anchor="start">3V3</text>
<text x="850" y="450" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle">GPIO10 fica ao lado do GPIO9 (DIN)</text>
<polyline points="240,430 240,490 610,490 610,270 691,270" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round"/>
<polyline points="170,430 170,516 635,516 635,340 691,340" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round"/>
<polyline points="100,430 100,542 660,542 660,410 691,410" fill="none" stroke="#d97706" stroke-width="5" stroke-linejoin="round"/>
<text x="40" y="610" font-size="15" fill="#111827" font-weight="600" text-anchor="start">• Perna 1 → 3V3   • Perna 2 (meio) → GPIO10   • Perna 3 → GND</text>
<text x="40" y="636" font-size="14" fill="#111827" font-weight="400" text-anchor="start">• Se o volume aumentar girando para o lado "errado", troque as pernas 1 e 3 de lugar.</text>
<text x="40" y="662" font-size="14" fill="#b91c1c" font-weight="600" text-anchor="start">⚠ Use o 3V3, NUNCA o 5Vin: o GPIO10 aguenta no máximo 3,3 V. O 3V3 e o GND podem ser os mesmos do microfone.</text>
</svg>